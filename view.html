<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>タクシーの現在地</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  #map{position:fixed;inset:0}
  #card{position:fixed;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:1000;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 3px 14px rgba(0,0,0,.25);display:flex;gap:14px;align-items:center}
  #badge{font-size:22px;font-weight:800;color:#fff;border-radius:999px;padding:8px 18px;letter-spacing:.1em;background:#9e9e9e;white-space:nowrap}
  #badge.free{background:#43a047}#badge.busy{background:#fb8c00}
  #plate{font-weight:700;font-size:16px}#when{color:#666;font-size:13px}
  .car{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.5);background:#9e9e9e}
  .car.free{background:#43a047}.car.busy{background:#fb8c00}
</style>
</head>
<body>
<div id="map"></div>
<div id="card"><div id="badge">確認中</div><div><div id="plate"></div><div id="when">タクシーの位置を取得しています…</div></div></div>
<script src="vendor/leaflet.js"></script>
<script type="module">
// お客様用ページ：QR コードから開き、タクシーの現在地と空車／実車を表示する（API キー不要）
import { DB_URL, makeCloud, validKey } from './js/cloud.js';
const q = new URLSearchParams(location.search), code = q.get('c') || '';
const db = /^https:\/\/[\w.-]+\.(firebaseio\.com|firebasedatabase\.app)\/?$/.test(q.get('db') || '') ? q.get('db') : DB_URL;
const cloud = makeCloud(() => db), $ = s => document.querySelector(s);
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([34.6975, 135.4868], 15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
let marker = null, first = true;
function show(state, plate, when) {
  const b = $('#badge'); b.className = state; b.textContent = { free: '空　車', busy: '実　車', '': '表示なし' }[state];
  $('#plate').textContent = plate; $('#when').textContent = when;
  if (marker) marker.setIcon(L.divIcon({ className: '', html: `<div class="car ${state}"></div>`, iconSize: [32, 32], iconAnchor: [16, 16] }));
}
async function tick() {
  if (!validKey(code)) return show('', '', 'URL が正しくありません。QR コードをもう一度読み取ってください。');
  let v; try { v = await cloud.get(`taxi_locations/${encodeURIComponent(code)}`); } catch { return show('', '', '通信できませんでした。電波の良い場所でお試しください。'); }
  if (!v || !Number.isFinite(v.latitude)) { marker?.remove(); marker = null; return show('', '', '現在、このタクシーの位置は公開されていません。'); }
  const pos = [v.latitude, v.longitude], age = Date.now() - v.timestamp, state = v.isAvailable ? 'free' : 'busy';
  if (!marker) marker = L.marker(pos, { icon: L.divIcon({ className: '', html: '<div class="car"></div>', iconSize: [32, 32], iconAnchor: [16, 16] }) }).addTo(map); else marker.setLatLng(pos);
  if (first) { map.setView(pos, 16); first = false; } else if (!map.getBounds().pad(-0.2).contains(pos)) map.panTo(pos);
  const t = new Date(v.timestamp).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  show(state, v.carNumber || '', age > 3 * 60000 ? `最終更新 ${t}（位置が古い可能性があります）` : `${t} 現在の位置`);
}
tick(); setInterval(() => { if (document.visibilityState === 'visible') tick(); }, 5000);
</script>
</body>
</html>
